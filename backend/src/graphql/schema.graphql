scalar DateTime

type MediaItem {
  id: Int!
  filepath: String!
  filename: String!
  createdAt: DateTime!
  fileType: String!
  fileSize: Int!
  duration: Float
  width: Int
  height: Int
  thumbnailUrl: String
  lastModified: DateTime!
  latitude: Float
  longitude: Float
  altitude: Float
  locationName: String
}

type ScanSession {
  id: Int!
  timestamp: DateTime!
  filesProcessed: Int!
  newFiles: Int!
  updatedFiles: Int!
  errors: Int!
  status: String!
  completedAt: DateTime
}

type ScanResult {
  processed: Int!
  newFiles: Int!
  updated: Int!
  errors: [ScanError!]!
}

type ScanFoldersResult {
  success: Boolean!
  message: String
  scannedCount: Int!
}

type ScanError {
  path: String!
  error: String!
}

type DuplicateGroup {
  id: Int!
  checksum: String!
  phash: String
  fileSize: Int!
  fileType: String!
  duplicateCount: Int!
  totalSize: Int!
  firstSeenAt: DateTime!
  lastSeenAt: DateTime!
  markedForReview: Boolean!
  files: [DuplicateFile!]!
}

type DuplicateFile {
  id: Int!
  groupId: Int!
  mediaId: Int
  filepath: String!
  filename: String!
  fileExists: Boolean!
  lastVerified: DateTime!
  suggestedForDeletion: Boolean!
  reason: String
}

type DuplicateExport {
  groupId: Int!
  checksum: String!
  totalFiles: Int!
  totalSize: Int!
  files: [DuplicateFileInfo!]!
}

type DuplicateFileInfo {
  filepath: String!
  filename: String!
  suggestedForDeletion: Boolean!
  reason: String
}

type Query {
  mediaByDateRange(start: DateTime!, end: DateTime!, sourcePath: String): [MediaItem!]!
  mediaByYear(year: Int!, sourcePath: String): [MediaItem!]!
  mediaByYearMonth(year: Int!, month: Int!, sourcePath: String): [MediaItem!]!
  allMedia(limit: Int, offset: Int, sourcePath: String): [MediaItem!]!
  allMediaUnfiltered(limit: Int, offset: Int): [MediaItem!]!
  mediaItem(id: Int!): MediaItem
  recentScanSessions(limit: Int = 10): [ScanSession!]!
  watcherStatus: WatcherStatus!
  thumbnailQueueStatus: ThumbnailQueueStatus!
  getCurrentWatchPath: String!
  getWatchPathHistory: [String!]!
  validatePath(path: String!): PathValidation!
  streamingServerStatus: StreamingServerStatus!
  streamingFolderStatus: StreamingFolderStatus!
  playlists: [Playlist!]!
  playlist(id: Int!): Playlist
  activePlaylist: Playlist
  indexedFolders: [IndexedFolder!]!
  getSubfolders(parentPath: String!): [SubfolderInfo!]!
  appConfig(key: String!): String
  duplicateGroups(markedForReview: Boolean): [DuplicateGroup!]!
  duplicateGroup(id: Int!): DuplicateGroup
  exportDuplicates: [DuplicateExport!]!
}

type WatcherStatus {
  isActive: Boolean!
  watchPaths: [String!]!
  lastProcessed: DateTime
  scanProgress: ScanProgress
  watcherEnabled: Boolean!
}

type ScanProgress {
  isScanning: Boolean!
  currentPath: String
  totalFiles: Int!
  processedFiles: Int!
  phase: String! # 'discovering' | 'processing' | 'generating_thumbnails' | 'complete'
  message: String
}

type ThumbnailQueueStatus {
  status: String! # 'idle' | 'waiting' | 'busy'
  queueSize: Int!
  stats: ThumbnailQueueStats!
  lastPing: DateTime
  lastRun: DateTime
  nextRun: DateTime
}

type ThumbnailQueueStats {
  totalQueued: Int!
  processed: Int!
  failed: Int!
  skipped: Int!
}

type ReindexResult {
  success: Boolean!
  message: String!
  thumbnailsProcessed: Int!
  errors: [String!]!
}

type PathValidation {
  isValid: Boolean!
  exists: Boolean!
  isDirectory: Boolean!
  hasMediaFiles: Boolean!
  mediaFileCount: Int!
  error: String
}

type StreamingServerStatus {
  isRunning: Boolean!
  port: Int!
  host: String!
  name: String!
  url: String!
  totalItems: Int!
  currentlyPlaying: Int
  localIp: String
}

type StreamingFolderStatus {
  totalItems: Int!
  currentlyPlaying: Int
  items: [StreamingItem!]!
}

type StreamingItem {
  id: Int!
  filename: String!
  isCurrentlyPlaying: Boolean!
}

type GenericResponse {
  success: Boolean!
  message: String
}

type IndexedFolder {
  id: Int!
  path: String!
  enabled: Boolean!
  lastScanned: DateTime
  lastModifiedTime: DateTime
  lastDeepScan: DateTime
  scanStrategy: String!
  totalFiles: Int!
  totalFolders: Int!
  addedAt: DateTime!
}

type SubfolderInfo {
  path: String!
  name: String!
  fileCount: Int!
  hasSubfolders: Boolean!
  lastModified: DateTime
}

type Playlist {
  id: Int!
  name: String!
  description: String
  isActive: Boolean!
  itemCount: Int!
  totalDuration: Float
  createdAt: DateTime!
  updatedAt: DateTime!
  items: [PlaylistItemDetail!]!
}

type PlaylistItemDetail {
  id: Int!
  position: Int!
  mediaItem: MediaItem!
  addedAt: DateTime!
}

input CreatePlaylistInput {
  name: String!
  description: String
  mediaItemIds: [Int!]!
}

input UpdatePlaylistInput {
  id: Int!
  name: String
  description: String
  mediaItemIds: [Int!]
}

input StreamingMediaInput {
  id: Int!
  filename: String!
  filepath: String!
  fileType: String!
  createdAt: String!
  fileSize: Int!
  duration: Float
  width: Int!
  height: Int!
  thumbnailId: String
}

type Mutation {
  triggerScan(path: String!, forceDeepScan: Boolean): ScanResult!
  regenerateThumbnails: Int!
  generateThumbnail(mediaItemId: Int!): Boolean!
  startWatcher(paths: [String!]!): WatcherStatus!
  stopWatcher: Boolean!
  pingThumbnailQueue(mediaIds: [Int!]): ThumbnailQueueStatus!
  clearThumbnailQueue: Boolean!
  reindexThumbnails: ReindexResult!
  clearAllThumbnails: ReindexResult!
  logPlaybackError(mediaId: Int!, error: String!, browserInfo: String): Boolean!
  changeWatchPath(path: String!): WatcherStatus!
  startStreamingServer: StreamingServerStatus!
  stopStreamingServer: Boolean!
  updateStreamingFolder(mediaItems: [StreamingMediaInput!]!, currentlyPlayingId: Int, forceRefresh: Boolean): StreamingFolderStatus!
  forceVLCRefresh: GenericResponse!
  createPlaylist(input: CreatePlaylistInput!): Playlist!
  updatePlaylist(input: UpdatePlaylistInput!): Playlist!
  deletePlaylist(id: Int!): GenericResponse!
  activatePlaylist(id: Int!): Playlist!
  deactivatePlaylist: GenericResponse!
  exportPlaylist(id: Int!, format: String): String!
  toggleWatcher(enabled: Boolean!): WatcherStatus!
  setAppConfig(key: String!, value: String!): Boolean!
  addIndexedFolder(path: String!, scanStrategy: String): IndexedFolder!
  removeIndexedFolder(id: Int!): Boolean!
  toggleIndexedFolder(id: Int!, enabled: Boolean!): IndexedFolder!
  setScanStrategy(id: Int!, strategy: String!): IndexedFolder!
  performDeepScan(id: Int!): ScanResult!
  scanFolders(folderIds: [Int!]!): ScanFoldersResult!
  markDuplicateGroupForReview(groupId: Int!, mark: Boolean!): DuplicateGroup!
  exportDuplicatePaths(format: String): String!
  clearDuplicateData: GenericResponse!
}